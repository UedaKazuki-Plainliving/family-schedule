name: CI - テスト自動実行

on:
  schedule:
    # 毎日 02:00 JST (= 17:00 UTC) にテスト実行
    - cron: '0 17 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. ユニットテスト（高速・ブラウザ不要）
  # ─────────────────────────────────────────
  unit-test:
    name: ユニットテスト (surefire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: ユニットテスト実行
        run: mvn test -B -e -Dtest="ScheduleValidatorTest,ScheduleServiceTest,ScheduleControllerTest,ScheduleRepositoryTest"

      - name: テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # 2. API 統合テスト（H2 インメモリ DB）
  # ─────────────────────────────────────────
  api-test:
    name: API テスト (failsafe / api/**)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: API 統合テスト実行
        run: mvn verify -B -e -Dsurefire.skip=true -Dit.test="SchedulesApiIT,MembersApiIT,ScenarioFlowIT"

      - name: 失敗詳細をサマリー＆ログに出力
        if: failure()
        run: |
          echo "## API テスト失敗詳細" >> $GITHUB_STEP_SUMMARY
          for f in target/failsafe-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "=== $f ===" && cat "$f"
            echo "### $f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          for f in target/failsafe-reports/*.xml; do
            [ -f "$f" ] || continue
            grep -E "(testcase|failure|error)" "$f" | head -50 && echo "---"
          done

      - name: テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # 3. E2E テスト（Playwright + Chromium）
  # ─────────────────────────────────────────
  e2e-test:
    name: E2E テスト (Playwright / e2e/**)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: テストコンパイル
        run: mvn test-compile -B -e

      - name: Playwright ブラウザ（Chromium）をインストール
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: E2E テスト実行
        run: mvn failsafe:integration-test failsafe:verify -B -Dit.test="SelectUserE2ETest,ViewScheduleE2ETest,CreateScheduleE2ETest,EditScheduleE2ETest,DeleteScheduleE2ETest,FlickNavigationE2ETest,UserMemoryE2ETest,SwitchUserE2ETest,MemberManagementE2ETest,ScenarioE2ETest,ScreenTransitionE2ETest,DateBoundaryExploreTest,LocalStorageExploreTest,XssExploreTest"

      - name: 失敗詳細をサマリー＆ログ＆アノテーションに出力
        if: failure()
        run: |
          echo "## E2E テスト失敗詳細" >> $GITHUB_STEP_SUMMARY
          for f in target/failsafe-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "=== $f ===" && cat "$f"
            echo "### $f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          # XML から失敗テスト名とエラーメッセージをアノテーションとして出力
          python3 - <<'PYEOF'
          import os, glob, xml.etree.ElementTree as ET
          for f in glob.glob("target/failsafe-reports/TEST-*.xml"):
              try:
                  root = ET.parse(f).getroot()
                  for tc in root.findall("testcase"):
                      fail = tc.find("failure") or tc.find("error")
                      if fail is not None:
                          cls = tc.get("classname","")
                          name = tc.get("name","")
                          msg = (fail.get("message","") or fail.text or "")[:300].replace("\n"," ")
                          print(f"::error title={cls}.{name}::{msg}")
              except Exception as e:
                  print(f"::warning::XML parse error {f}: {e}")
          PYEOF

      - name: スクリーンショット・動画をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: target/evidence/
          if-no-files-found: warn

      - name: E2E テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # 4. テスト結果メール通知
  #    全テスト完了後（成否にかかわらず）
  #    スケジュール実行時は JST 8:00 頃送信
  #    ※ Gmail の設定: Google アカウント →
  #      セキュリティ → アプリパスワードで発行し
  #      GitHub Secrets に設定してください:
  #        GMAIL_USERNAME  : plainliving.uk@gmail.com
  #        GMAIL_APP_PASSWORD : 16桁のアプリパスワード
  # ─────────────────────────────────────────
  notify:
    name: 結果メール送信
    runs-on: ubuntu-latest
    needs: [ unit-test, api-test, e2e-test ]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: テスト結果をまとめてメール送信
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: >
            【家族スケジュール】自動テスト結果
            (${{ needs.unit-test.result == 'success' && needs.api-test.result == 'success' && needs.e2e-test.result == 'success' && '全テスト成功' || 'テスト失敗あり' }})
          to: plainliving.uk@gmail.com
          from: 家族スケジュール CI <${{ secrets.GMAIL_USERNAME }}>
          body: |
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            家族スケジュール 自動テスト結果
            実行日時: ${{ github.run_id }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━

            ■ ユニットテスト  : ${{ needs.unit-test.result }}
            ■ API テスト       : ${{ needs.api-test.result }}
            ■ E2E テスト       : ${{ needs.e2e-test.result }}

            詳細はこちら:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ※ このメールは GitHub Actions から自動送信されています
