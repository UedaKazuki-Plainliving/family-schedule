name: CI - テスト自動実行

on:
  schedule:
    # 毎日 02:00 JST (= 17:00 UTC) にテスト実行
    - cron: '0 17 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # 1. ユニットテスト（高速・ブラウザ不要）
  # ─────────────────────────────────────────
  unit-test:
    name: ユニットテスト (surefire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: ユニットテスト実行
        run: mvn test -B

      - name: テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/

  # ─────────────────────────────────────────
  # 2. API 統合テスト（H2 インメモリ DB）
  # ─────────────────────────────────────────
  api-test:
    name: API テスト (failsafe / api/**)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: API 統合テスト実行
        run: mvn verify -B -Dsurefire.skip=true

      - name: テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/failsafe-reports/

  # ─────────────────────────────────────────
  # 3. E2E テスト（Playwright + Chromium）
  # ─────────────────────────────────────────
  e2e-test:
    name: E2E テスト (Playwright / e2e/**)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Playwright ブラウザ（Chromium）をインストール
        run: |
          mvn test-compile -B -q
          mvn exec:java -e -q \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: E2E テスト実行
        run: mvn verify -B -Dsurefire.skip=true

      - name: スクリーンショット・動画をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: target/evidence/

      - name: E2E テストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: target/failsafe-reports/

  # ─────────────────────────────────────────
  # 4. テスト結果メール通知
  #    全テスト完了後（成否にかかわらず）
  #    スケジュール実行時は JST 8:00 頃送信
  #    ※ Gmail の設定: Google アカウント →
  #      セキュリティ → アプリパスワードで発行し
  #      GitHub Secrets に設定してください:
  #        GMAIL_USERNAME  : plainliving.uk@gmail.com
  #        GMAIL_APP_PASSWORD : 16桁のアプリパスワード
  # ─────────────────────────────────────────
  notify:
    name: 結果メール送信
    runs-on: ubuntu-latest
    needs: [ unit-test, api-test, e2e-test ]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: テスト結果をまとめてメール送信
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: >
            【家族スケジュール】自動テスト結果
            (${{ needs.unit-test.result == 'success' && needs.api-test.result == 'success' && needs.e2e-test.result == 'success' && '✅ 全テスト成功' || '❌ テスト失敗あり' }})
          to: plainliving.uk@gmail.com
          from: 家族スケジュール CI <${{ secrets.GMAIL_USERNAME }}>
          body: |
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            家族スケジュール 自動テスト結果
            実行日時: ${{ github.run_id }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━

            ■ ユニットテスト  : ${{ needs.unit-test.result }}
            ■ API テスト       : ${{ needs.api-test.result }}
            ■ E2E テスト       : ${{ needs.e2e-test.result }}

            詳細はこちら:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━
            ※ このメールは GitHub Actions から自動送信されています
