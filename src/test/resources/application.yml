spring:
  datasource:
    url: jdbc:h2:mem:family;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-h2
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: WARN
    com.family.schedule: INFO
