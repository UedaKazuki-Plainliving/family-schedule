# Fly.io configuration for family-schedule
# Run `fly launch --copy-config` once to claim an app name, then edit here.

app = "family-schedule"               # ← fly launch 時に実際の一意名に書き換える
primary_region = "nrt"                # 東京リージョン

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # お父さんの「パッと開く」要件のため、アイドル停止させない
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = "/app/BOOT-INF/classes/static"
  url_prefix = "/static"
